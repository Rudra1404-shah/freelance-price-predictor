version: '3.8'

services:
  freelance-predictor:
    build: .
    container_name: freelance-predictor-api
    ports:
      - "8000:8000"
    environment:
      - USE_TF=0
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
